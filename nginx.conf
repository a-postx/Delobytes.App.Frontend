server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Фото товаров принимаются бэкендом до 10 МБ; дефолтный лимит nginx в 1 МБ
    # отбивал бы такие загрузки на 413 ещё до попадания в приложение.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/xml+rss image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Маршрутизация клиентская (createWebHistory): любой путь без файла отдаётся
    # в index.html, иначе прямые переходы по /invite, /auth/*/callback и
    # перезагрузка страницы получают 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Имена файлов бандлов содержат хеш, поэтому кэшируются навсегда.
    # add_header в location отменяет наследование серверных заголовков,
    # поэтому они повторяются здесь.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Статика вне /assets/ не хеширована — кэш короткий.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html не кэшируется, чтобы новый деплой подхватывался сразу.
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0;
    }
}
